version: '3.8'

services:
  # ── Redis (queue backend) ────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:     ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Worker (BullMQ processors + cron scheduler) ──────────
  worker:
    build:
      context: .
      target:  runner
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./assets:/app/assets
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus:   '1.5'

  # ── API server (health + manual trigger endpoint) ────────
  api:
    build:
      context: .
      target:  runner
    restart: unless-stopped
    command: ['node', 'dist/index.js']
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:     ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Bull Board (queue monitoring UI) ─────────────────────
  bull-board:
    image: deadly0/bull-board:latest
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULL_PREFIX=bull
    depends_on:
      - redis

volumes:
  redis_data:
    driver: local
